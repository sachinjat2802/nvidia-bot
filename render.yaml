services:
  - type: web
    name: moonu-bot
    runtime: docker # Changed to docker to match your Render logs
    plan: free
    region: singapore
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: DEFAULT_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: CHAT_HISTORY_LIMIT
        value: 50
      - key: PORT
        value: 10000
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
